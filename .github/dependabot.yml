# Dependabot: grouped, weekly updates. Security fixes and minor/patch updates are
# grouped into one pull request per ecosystem and directory; majors are ignored.
# See ifx-docs 14.1 Security baseline, step 2.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major versions change behaviour; each gets its own plan (ifx-docs 14.1, step 5C).
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major versions change behaviour; each gets its own plan (ifx-docs 14.1, step 5C).
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major versions change behaviour; each gets its own plan (ifx-docs 14.1, step 5C).
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
